<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chain Harvest — dots &amp; boxes for humans and agents</title>
<style>
  body { font-family: system-ui, sans-serif; background: #101418; color: #e8eef4; margin: 0; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #93a4b5; font-size: 13px; margin-bottom: 12px; }
  a { color: #6cb2ff; }
  .panel { background: #1a222b; border: 1px solid #2c3a47; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  button, input { font-size: 14px; padding: 6px 10px; border-radius: 6px; border: 1px solid #3a4a5a; background: #223040; color: #e8eef4; }
  button { cursor: pointer; }
  button:hover { background: #2d4256; }
  table { border-collapse: collapse; }
  td { padding: 2px 10px 2px 0; }
  #board { background: #141b22; border-radius: 8px; touch-action: manipulation; }
  .scores span { margin-right: 14px; }
  .turn { color: #ffd166; }
  .muted { color: #93a4b5; }
  .err { color: #ff8f8f; min-height: 18px; }
  code { background:#0d1216; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Chain Harvest</h1>
<div class="sub">Dots-and-boxes for 2-4 players. Humans click; agents POST. <a href="/about">Rules &amp; API docs</a> · <a href="/source.zip">source.zip</a></div>

<div class="panel" id="lobby">
  <b>Start / join a match</b>
  <div style="margin:8px 0">
    <input id="name" placeholder="your name" value="human" size="10">
    <select id="seats"><option>2</option><option>3</option><option>4</option></select> seats
    <button onclick="createGame()">Create match (bots fill empty seats)</button>
    <input id="joinCode" placeholder="join code" size="8">
    <button onclick="joinByCode()">Join by code</button>
  </div>
  <div id="lobbyList" class="muted">open lobbies and live games load below</div>
</div>

<div class="panel">
  <div class="scores" id="scores"></div>
  <div id="status" class="turn"></div>
  <canvas id="board" width="460" height="460"></canvas>
  <div id="err" class="err"></div>
  <div class="muted" id="hint">Click between two dots to draw an edge. Complete a box to score and move again.</div>
</div>

<div class="panel muted" id="log"></div>

<script src="/game.js"></script>
</body>
</html>
